<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="The Privacy Policy and Terms of Use for My BP Numbers, an iPhone app for keeping a blood pressure record and printing it for your doctor.">
<title>My BP Numbers</title>
<style>
  :root {{ --paper:#FCF7F1; --ink:#1C1917; --quiet:#6B665F; --navy:#1E3A5F; --brand:#C6223D; }}
  @media (prefers-color-scheme: dark) {{
    :root {{ --paper:#14120F; --ink:#F1EAE0; --quiet:#A9A197; --navy:#8FB6E0; --brand:#F0546E; }}
  }}
  * {{ box-sizing: border-box; }}
  body {{
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: "Public Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 17px; line-height: 1.62; -webkit-font-smoothing: antialiased;
  }}
  main {{ max-width: 34rem; margin: 0 auto; padding: 4rem 1.5rem 5rem; }}
  h1 {{
    font-family: Georgia, "Source Serif 4", serif; font-size: 1.9rem; font-weight: 600;
    letter-spacing: -0.015em; margin: 0 0 0.4rem;
  }}
  h1 .slash {{ color: var(--brand); }}
  p {{ color: var(--quiet); margin: 0 0 2.25rem; }}
  ul {{ list-style: none; margin: 0; padding: 0; display: grid; gap: 0.9rem; }}
  a {{ color: var(--navy); font-weight: 600; text-underline-offset: 0.16em; }}
  a:focus-visible {{ outline: 2px solid var(--brand); outline-offset: 3px; border-radius: 2px; }}
  footer {{ margin-top: 3.5rem; font-size: 0.85rem; color: var(--quiet); }}
</style>
</head>
<body>
<main>
  <h1>My BP&nbsp;Numbers<span class="slash">.</span></h1>
  <p>An iPhone app for keeping a blood pressure record and printing it for your doctor.</p>
  <ul>
    <li><a href="privacy.html">Privacy Policy</a></li>
    <li><a href="terms.html">Terms of Use</a></li>
  </ul>
  <footer>Kristina Nelson · Minnesota, USA · kjoysky31@gmail.com</footer>
</main>
</body>
</html>
